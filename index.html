<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07100f">
    <meta name="description" content="A slow, persistent ASCII aquarium and nightlight prototype.">
    <title>Fish View — Phase 0</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <section class="aquarium-stage" id="aquarium-stage" data-mode="landscape" aria-label="Aquarium orientation preview">
        <figure class="tank tank--portrait" data-view="portrait">
          <canvas id="portrait-canvas" aria-label="Portrait ASCII aquarium. Touch the water and the fish will approach."></canvas>
          <figcaption>Portrait · 480 × 800</figcaption>
        </figure>
        <figure class="tank tank--landscape" data-view="landscape">
          <canvas id="landscape-canvas" aria-label="Landscape ASCII aquarium. Touch the water and the fish will approach."></canvas>
          <figcaption>Landscape · 800 × 480</figcaption>
        </figure>
      </section>

      <nav class="view-controls" aria-label="Aquarium view controls">
        <div class="segmented" role="group" aria-label="Orientation">
          <button type="button" data-mode-button="portrait">Portrait</button>
          <button type="button" data-mode-button="landscape" class="is-active">Landscape</button>
          <button type="button" data-mode-button="compare">Compare</button>
        </div>
        <button type="button" id="debug-toggle" aria-expanded="false" aria-controls="debug-panel">Tune</button>
        <button type="button" id="fullscreen-toggle">Full screen</button>
      </nav>
    </main>

    <aside class="debug-panel" id="debug-panel" hidden>
      <div class="debug-panel__heading">
        <div>
          <p class="eyebrow">Separate debug surface</p>
          <h1>Phase 0 tuning</h1>
        </div>
        <button type="button" id="debug-close">Close</button>
      </div>

      <section>
        <h2>School</h2>
        <label>Fish <output data-output="schoolCount">32</output>
          <input data-setting="schoolCount" type="range" min="25" max="40" step="1" value="32">
        </label>
        <label>Separation <output data-output="separation">1.25</output>
          <input data-setting="separation" type="range" min="0" max="2.5" step="0.05" value="1.25">
        </label>
        <label>Alignment <output data-output="alignment">0.72</output>
          <input data-setting="alignment" type="range" min="0" max="1.5" step="0.02" value="0.72">
        </label>
        <label>Cohesion <output data-output="cohesion">0.48</output>
          <input data-setting="cohesion" type="range" min="0" max="1.2" step="0.02" value="0.48">
        </label>
        <label>Boundary pull <output data-output="boundary">1.10</output>
          <input data-setting="boundary" type="range" min="0.2" max="2.2" step="0.05" value="1.1">
        </label>
        <label>Depth preference <output data-output="depthPreference">0.24</output>
          <input data-setting="depthPreference" type="range" min="0" max="0.8" step="0.02" value="0.24">
        </label>
        <label>Speed <output data-output="schoolSpeed">1.45</output>
          <input data-setting="schoolSpeed" type="range" min="0.5" max="2.4" step="0.05" value="1.45">
        </label>
      </section>

      <section>
        <h2>Long horizon</h2>
        <label>Time acceleration
          <select id="time-scale">
            <option value="1">Real time</option>
            <option value="3600">One hour per second</option>
            <option value="86400">One day per second</option>
            <option value="604800">One week per second</option>
          </select>
        </label>
        <label>Time of day <output id="clock-output">12:00</output>
          <input id="clock-control" type="range" min="0" max="23.9" step="0.1" value="12">
        </label>
      </section>

      <section>
        <h2>Renderer</h2>
        <dl class="metrics">
          <div><dt>Update rate</dt><dd id="fps-output">—</dd></div>
          <div><dt>Damage area</dt><dd id="damage-output">—</dd></div>
          <div><dt>Damage rectangles</dt><dd id="rect-output">—</dd></div>
          <div><dt>Simulated age</dt><dd id="age-output">—</dd></div>
        </dl>
        <a href="sprites.html">Open sprite-sheet test page</a>
      </section>

      <section class="debug-actions">
        <button type="button" id="reset-simulation">Reset this prototype</button>
      </section>
    </aside>

    <script type="module" src="src/app.js?v=opaque-bodies-20260830"></script>
  </body>
</html>
