name: Apply automated review fix

on:
  push:
    branches: [feat/phase1-readable-fish-behavior]

permissions:
  contents: write

jobs:
  fix-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: feat/phase1-readable-fish-behavior
          fetch-depth: 0

      - name: Restore clearance-adjusted mid-water ceiling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          tick_path = Path('src/sim/tick.js')
          tick = tick_path.read_text()
          pattern = re.compile(
              r'  const protectedMaximumY = WATERLINE_ROWS\n'
              r'\s*\+ \(state\.rows - SUBSTRATE_ROWS - WATERLINE_ROWS\) \* 0\.68;'
          )
          replacement = '''  // The permanent mid-water cast keeps the same clearance-adjusted
          // swimming envelope it had before terrain-aware foraging. Applying the
          // 68% ceiling to the raw water column lets large/pitched fish drift
          // visibly deeper because their body clearance is ignored.
          const protectedMaximumY = WATERLINE_ROWS
            + Math.max(0, baseMaximumY - WATERLINE_ROWS) * 0.68;'''
          tick, count = pattern.subn(replacement, tick, count=1)
          if count != 1:
              raise SystemExit(f'expected one protectedMaximumY block, found {count}')
          tick_path.write_text(tick)

          test_path = Path('tests/phase1-fish-behavior.test.js')
          tests = test_path.read_text()
          config_import = 'import { WATERLINE_ROWS } from "../src/sim/config.js";\n'
          if config_import not in tests:
              marker = 'import test from "node:test";\n\n'
              if marker not in tests:
                  raise SystemExit('test import marker not found')
              tests = tests.replace(marker, marker + config_import, 1)

          marker = '''test("hunger relief begins only after a forage fish reaches the real substrate search zone", () => {'''
          regression = '''test("permanent mid-water cast keeps its clearance-adjusted ceiling during long runs", () => {
            let state = createAquariumState({ orientation: "landscape", seed: 0, wallClockHours: 12 });
            for (let frame = 0; frame < 4000; frame += 1) {
              state = tick(state, 0.1);
              for (const fish of state.individuals.slice(0, 3)) {
                const clearanceAdjustedBottom = substrateSafeY(fish, state, fish.x);
                const ceiling = WATERLINE_ROWS
                  + Math.max(0, clearanceAdjustedBottom - WATERLINE_ROWS) * 0.68;
                assert.ok(
                  fish.y <= ceiling + 1e-10,
                  `protected fish drifted below clearance-adjusted ceiling: ${fish.y} > ${ceiling}`,
                );
              }
            }
          });

          '''
          if 'permanent mid-water cast keeps its clearance-adjusted ceiling during long runs' not in tests:
              if marker not in tests:
                  raise SystemExit('regression insertion marker not found')
              tests = tests.replace(marker, regression + marker, 1)
          test_path.write_text(tests)
          PY

      - name: Run full test suite
        run: npm test

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/review-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sim/tick.js tests/phase1-fish-behavior.test.js .github/workflows/review-fix.yml
          git commit -m 'Restore clearance-adjusted mid-water ceiling'
          git push origin HEAD:feat/phase1-readable-fish-behavior
