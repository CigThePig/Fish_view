name: Apply latest Phase 7 review fixes

on:
  push:
    branches:
      - phase-7-1-readability-baseline

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'Run latest Phase 7 review repair')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase-7-1-readability-baseline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded fixes
        run: |
          python tools/apply-latest-phase7-review-fixes.py
          python tools/refine-latest-phase7-review-fixes.py
      - name: Run focused regressions
        run: node --test tests/chase-observation.test.js tests/choreography-tuning.test.js tests/phase7-review-regressions.test.js tests/phase7-vocabulary-freeze.test.js
      - name: Run chase production observation
        run: node --test tests/interaction-observation.test.js
      - name: Audit frozen vocabulary semantics
        run: npm run audit:phase7-vocabulary -- --output=.audit-output/latest-review-vocabulary
      - name: Observe natural production vocabulary
        run: npm run measure:remaining-vocabulary -- --seconds=1800 --output=.audit-output/latest-review-natural
      - name: Run full suite
        run: npm test
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sim/chase-arc.js src/sim/fish-activities.js src/sim/choreography-tuning.js src/dev/choreography-fields.js tools/audit-phase7-vocabulary.mjs tools/audit-remaining-vocabulary.mjs tests/choreography-tuning.test.js tests/phase7-review-regressions.test.js tests/phase7-vocabulary-freeze.test.js
          git commit -m "Fix latest Phase 7 review findings"
          git push origin HEAD:phase-7-1-readability-baseline
