name: Verify aquarium

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run audit:simulation
      - run: npm run audit:persistence -- --cases=200
      - run: npm run audit:render
      - run: npm run measure:feeding
      - run: npm run measure:relationship
      - run: npm run capture:relationship -- --scale=0.25 --output=.audit-output/relationship-captures
      - uses: actions/upload-artifact@v4
        with:
          name: phase6-relationship-captures
          path: .audit-output/relationship-captures
          if-no-files-found: error
          retention-days: 14
      - name: Commit verified Phase 6 visual evidence
        if: github.event_name == 'pull_request' && github.head_ref == 'phase-6-viewer-relationship'
        run: |
          mkdir -p /tmp/phase6-evidence
          cp .audit-output/relationship-captures/phase6-relationship-contact-sheet.png /tmp/phase6-evidence/
          cp .audit-output/relationship-captures/phase6-relationship-capture-manifest.json /tmp/phase6-evidence/
          git fetch origin "${{ github.head_ref }}"
          git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
          mkdir -p docs/assets/stage-2/phase-6
          cp /tmp/phase6-evidence/phase6-relationship-contact-sheet.png docs/assets/stage-2/phase-6/
          cp /tmp/phase6-evidence/phase6-relationship-capture-manifest.json docs/assets/stage-2/phase-6/
          git add docs/assets/stage-2/phase-6
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Commit Phase 6 relationship visual evidence'
          git push origin HEAD:${{ github.head_ref }}
