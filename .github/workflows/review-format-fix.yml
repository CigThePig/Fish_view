name: Clean review fix formatting

on:
  push:
    branches: [feat/phase1-readable-fish-behavior]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: feat/phase1-readable-fish-behavior
          fetch-depth: 0

      - name: Normalize tick formatting
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("src/sim/tick.js"); s=p.read_text(); old="  // The permanent mid-water cast keeps the same clearance-adjusted\n// swimming envelope it had before terrain-aware foraging. Applying the\n// 68% ceiling to the raw water column lets large/pitched fish drift\n// visibly deeper because their body clearance is ignored.\nconst protectedMaximumY = WATERLINE_ROWS\n  + Math.max(0, baseMaximumY - WATERLINE_ROWS) * 0.68;"; new="  // The permanent mid-water cast keeps the same clearance-adjusted\n  // swimming envelope it had before terrain-aware foraging. Applying the\n  // 68% ceiling to the raw water column lets large/pitched fish drift\n  // visibly deeper because their body clearance is ignored.\n  const protectedMaximumY = WATERLINE_ROWS\n    + Math.max(0, baseMaximumY - WATERLINE_ROWS) * 0.68;"; assert old in s; p.write_text(s.replace(old,new,1))'

      - name: Run full test suite
        run: npm test

      - name: Commit cleanup and remove workflow
        shell: bash
        run: |
          rm .github/workflows/review-format-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sim/tick.js .github/workflows/review-format-fix.yml
          git commit -m 'Clean mid-water ceiling formatting'
          git push origin HEAD:feat/phase1-readable-fish-behavior
