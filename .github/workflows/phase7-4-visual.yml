name: Phase 7.4 plant weave visual

on:
  push:
    branches:
      - phase-7-1-readability-baseline

permissions:
  contents: read

jobs:
  capture:
    if: github.event.head_commit.message == 'Capture Phase 7.4 plant weave'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture plant behavior comparison
        run: npm run capture:behaviors -- --scenario=plant-weave,plant-investigate,plant-shelter --scale=0.5 --gif --output=.audit-output/phase7-4-plant-visual
      - uses: actions/upload-artifact@v4
        with:
          name: phase7-4-plant-visual-${{ github.run_id }}
          path: .audit-output/phase7-4-plant-visual
          if-no-files-found: error
