name: Verify and deploy Phase 0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify deterministic simulation and renderer
        run: node --test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage the static site
        run: |
          mkdir _site
          cp *.html *.css LICENSE THIRD_PARTY_NOTICES.md _site/
          cp -R src _site/src

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
