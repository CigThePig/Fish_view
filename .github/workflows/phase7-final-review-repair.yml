name: Apply Phase 7 final review fixes

on:
  push:
    branches:
      - phase-7-1-readability-baseline

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'Add Phase 7 final review repair workflow')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase-7-1-readability-baseline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply guarded source and regression patches
        run: python tools/apply-phase7-final-review.py
      - name: Run focused review regressions
        run: node --test tests/phase7-review-regressions.test.js tests/phase6-glass-visits.test.js tests/phase7-vocabulary-freeze.test.js
      - name: Run full suite
        run: npm test
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sim/fish-activities.js src/sim/glass-visits.js .github/workflows/verify.yml tests/phase7-review-regressions.test.js tests/phase6-glass-visits.test.js tests/phase7-vocabulary-freeze.test.js
          git commit -m "Fix Phase 7 final review findings"
          git push origin HEAD:phase-7-1-readability-baseline
