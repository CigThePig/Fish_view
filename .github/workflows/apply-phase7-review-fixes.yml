name: Apply Phase 7 review fixes

on:
  push:
    branches:
      - phase-7-1-readability-baseline

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase-7-1-readability-baseline
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Apply focused review fixes
        run: python tools/apply-phase7-review-fixes.py
      - name: Install dependencies
        run: npm ci
      - name: Run focused review regressions
        run: node --test tests/phase7-review-regressions.test.js
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sim/fish-activities.js src/sim/fish-choreography.js tests/phase7-review-regressions.test.js
          git commit -m "Fix Phase 7 production review findings"
          git push origin HEAD:phase-7-1-readability-baseline
