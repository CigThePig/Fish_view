name: Phase 7.4 diagnostics

on:
  push:
    branches:
      - phase-7-1-readability-baseline

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Stage Phase 7.4 diagnostics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare Phase 7.4 candidate
        run: node tools/finalize-phase7-4.mjs
      - name: Run targeted diagnostics
        run: |
          echo "Phase 7.4 diagnostic retry"
          node --test tests/attention-roles.test.js tests/hold-presence.test.js tests/phase7-plant-weave.test.js || true
