name: Phase 7.4 finalizer

on:
  push:
    branches:
      - phase-7-1-readability-baseline

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Stage Phase 7.4 finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply final Phase 7.4 integration patch
        run: node tools/finalize-phase7-4.mjs
      - name: Verify finalizer result
        run: |
          git diff --check
          npm test
      - name: Commit tested Phase 7.4 result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Phase 7.4 preserve interaction semantics"
          git push origin HEAD:phase-7-1-readability-baseline
