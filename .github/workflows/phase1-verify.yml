name: Verify Phase 1 fish behavior

on:
  push:
    branches: [feat/phase1-readable-fish-behavior]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 1 branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply staged renderer and lab integration once
        id: apply
        shell: bash
        run: |
          if grep -q 'phase1-pitch-20260830' src/render/render.js; then
            echo 'Renderer integration already present.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            node tools/apply-phase1.mjs
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md index.html sprites.html src tests tools
            git commit -m 'Implement Phase 1 fish pitch and terrain foraging'
            git push origin HEAD:feat/phase1-readable-fish-behavior
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Run full test suite
        run: npm test

      - name: Measure current main baseline
        shell: bash
        run: |
          rm -rf /tmp/fish-view-main
          git worktree add --detach /tmp/fish-view-main origin/main
          node tools/measure-phase1.mjs /tmp/fish-view-main

      - name: Measure Phase 1 branch
        run: node tools/measure-phase1.mjs .
