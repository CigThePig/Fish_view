name: Verify Phase 1 fish behavior

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/phase1-readable-fish-behavior]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 1 branch
        uses: actions/checkout@v6
        with:
          ref: feat/phase1-readable-fish-behavior
          fetch-depth: 0

      - name: Tighten pitched rear body slices once
        shell: bash
        run: |
          if grep -q 'rearBaseInset' src/render/render.js; then
            echo 'Pitched tail inset already present.'
          else
            python3 - <<'PY'
          from pathlib import Path

          old = '''      const baseLeft = centerX - sliceWidth / 2;
                const baseRight = centerX + sliceWidth / 2;
                const fullLeft = Math.min(cornerLeft, baseLeft);
                const fullRight = Math.max(cornerRight, baseRight);
                // Bounding a rotated vertical slice as a rectangle adds empty
                // triangular corners. At the rear of the fish those corners can
                // reach into the authored tail even though the ideal slice does
                // not. Keep the full expansion through the body, but taper only
                // the trailing-side AABB excess across the two rear slices.
                const rearExpansionFactor = index === 0 ? 0 : index === 1 ? 0.45 : 1;
                if (facing < 0) {
                  left = Math.round(fullLeft);
                  right = Math.round(baseRight + (fullRight - baseRight) * rearExpansionFactor) + 1;
                } else {
                  left = Math.round(baseLeft - (baseLeft - fullLeft) * rearExpansionFactor);
                  right = Math.round(fullRight) + 1;
                }'''
          new = '''      const pitchFraction = Math.min(1, Math.abs(pitch) / 30);
                // The level body deliberately preserves enough local glyph width to
                // stay opaque through an edge-on turn. Once the body pitches, that
                // same safety width can extend through the authored tail at the rear
                // end. Inset only the trailing edge of the first two source slices,
                // proportional to pitch, while leaving their noseward edge and every
                // interior slice untouched.
                const rearBaseInset = sliceWidth
                  * (index === 0 ? 0.42 : index === 1 ? 0.08 : 0)
                  * pitchFraction;
                let baseLeft = centerX - sliceWidth / 2;
                let baseRight = centerX + sliceWidth / 2;
                if (facing < 0) baseRight -= rearBaseInset;
                else baseLeft += rearBaseInset;
                const fullLeft = Math.min(cornerLeft, baseLeft);
                const fullRight = Math.max(cornerRight, baseRight);
                // Bounding a rotated vertical slice as a rectangle adds empty
                // triangular corners. At the rear of the fish those corners can
                // reach into the authored tail even though the ideal slice does
                // not. Keep the full expansion through the body, but taper only
                // the trailing-side AABB excess across the two rear slices.
                const rearExpansionFactor = index === 0 ? 0 : index === 1 ? 0.45 : 1;
                if (facing < 0) {
                  left = Math.round(fullLeft);
                  right = Math.round(baseRight + (fullRight - baseRight) * rearExpansionFactor) + 1;
                } else {
                  left = Math.round(baseLeft - (baseLeft - fullLeft) * rearExpansionFactor);
                  right = Math.round(fullRight) + 1;
                }'''

          for filename in ['src/render/render.js', 'src/render/body-profile-lab.js']:
              path = Path(filename)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'missing pitched body block in {filename}')
              path.write_text(text.replace(old, new, 1))
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/render/render.js src/render/body-profile-lab.js
            git commit -m 'Tighten pitched rear body around open tail'
            git push origin HEAD:feat/phase1-readable-fish-behavior
          fi

      - name: Run full test suite
        run: npm test

      - name: Measure current main baseline
        shell: bash
        run: |
          rm -rf /tmp/fish-view-main
          git worktree add --detach /tmp/fish-view-main origin/main
          node tools/measure-phase1.mjs /tmp/fish-view-main

      - name: Measure Phase 1 branch
        run: node tools/measure-phase1.mjs .
