name: Verify Phase 1 fish behavior

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/phase1-readable-fish-behavior]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 1 branch
        uses: actions/checkout@v6
        with:
          ref: feat/phase1-readable-fish-behavior
          fetch-depth: 0

      - name: Apply tail-safe pitched body approximation once
        shell: bash
        run: |
          if grep -q 'rearExpansionFactor' src/render/render.js; then
            echo 'Tail-safe pitched body approximation already present.'
          else
            echo 'Expected tail-safe body approximation is missing.' >&2
            exit 1
          fi

      - name: Upgrade pitched tail regression to raster ink once
        shell: bash
        run: |
          if grep -q 'hasUnbackedInk' tests/phase1-pitch-render.test.js; then
            echo 'Raster tail regression already present.'
          else
            python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/phase1-pitch-render.test.js')
          text = path.read_text()
          text = text.replace(
              'import { glyphPixels } from "../src/render/bitmap-font.js";',
              'import { glyphPixelRects, glyphPixels } from "../src/render/bitmap-font.js";',
              1,
          )
          anchor = '''function backsGlyph(object, glyph) {
            const centre = inkCentre(glyph);
            return object.fill.some((span) => centre.x >= span.x && centre.x <= span.x + span.width
              && centre.y >= span.y && centre.y <= span.y + span.height);
          }
          '''
          helper = anchor + '''
          function hasUnbackedInk(object, glyph) {
            for (const rect of glyphPixelRects(glyph)) {
              for (let y = rect.y; y < rect.y + rect.height; y += 1) {
                for (let x = rect.x; x < rect.x + rect.width; x += 1) {
                  const covered = object.fill.some((span) => x >= span.x && x < span.x + span.width
                    && y >= span.y && y < span.y + span.height);
                  if (!covered) return true;
                }
              }
            }
            return false;
          }
          '''
          if anchor not in text:
              raise SystemExit('missing backsGlyph anchor')
          text = text.replace(anchor, helper, 1)
          old = '''            assert.ok(
              tailGlyphs.some((glyph) => !backsGlyph(object, glyph)),
              `${sprite.id} swallowed its authored pitched tail at ${pitch}° ${facing}`,
            );'''
          new = '''            assert.ok(
              tailGlyphs.some((glyph) => hasUnbackedInk(object, glyph)),
              `${sprite.id} swallowed all authored pitched tail ink at ${pitch}° ${facing}`,
            );'''
          if old not in text:
              raise SystemExit('missing tail assertion anchor')
          path.write_text(text.replace(old, new, 1))
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add tests/phase1-pitch-render.test.js
            git commit -m 'Measure pitched tail openness from raster ink'
            git push origin HEAD:feat/phase1-readable-fish-behavior
          fi

      - name: Run full test suite
        run: npm test

      - name: Measure current main baseline
        shell: bash
        run: |
          rm -rf /tmp/fish-view-main
          git worktree add --detach /tmp/fish-view-main origin/main
          node tools/measure-phase1.mjs /tmp/fish-view-main

      - name: Measure Phase 1 branch
        run: node tools/measure-phase1.mjs .
